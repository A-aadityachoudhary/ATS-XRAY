[project]
name = "ats-xray"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaditya Choudhary", email = "aadityach812@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "jinja2>=3.1.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
ats-xray = "ats_xray:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
